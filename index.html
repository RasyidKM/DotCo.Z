<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi Produk Shopee</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Trik agar produk otomatis tersusun berurutan ke bawah */
        #link-container {
            display: flex;
            flex-direction: column;
            gap: 12px; /* Jarak antar kotak produk agar tidak menempel */
            width: 100%;
            max-width: 450px; /* Batas lebar maksimal kotak agar pas di HP/Laptop */
            margin: 20px auto 0 auto;
        }

        /* Mengubah link menjadi kotak persegi panjang warna oranye */
        .button-link {
            background-color: #EE4D2D; /* Warna Oranye khas Shopee */
            color: white !important; /* Warna tulisan di dalam kotak jadi putih */
            text-decoration: none; /* Menghilangkan garis bawah pada link */
            padding: 14px 20px; /* Mengatur tinggi dan lebar dalam kotak (persegi panjang) */
            border-radius: 8px; /* Membuat sudut kotak sedikit melengkung biar estetik */
            font-weight: bold;
            font-size: 15px;
            display: block; /* Memaksa kotak mengambil lebar penuh */
            text-align: left; /* Tulisan produk rata kiri */
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08); /* Efek bayangan halus */
        }

        /* Efek sedikit menggelap & membesar saat tombol disentuh/diklik */
        .button-link:hover {
            background-color: #d73c1d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img">SA</div>
        
        <h2>DotCo.Z Affiliate</h2>
        <p class="subtitle">Spill produk murah & berkualitas di sini!</p>

        <div id="link-container">
            <p>Memuat produk...</p>
        </div>
    </div>

    <script>
        async function loadLinks() {
            const response = await fetch('/api/links');
            const links = await response.json();
            const container = document.getElementById('link-container');
            
            if (links.length === 0) {
                container.innerHTML = '<p style="color:#999; text-align:center;">Belum ada produk yang ditambahkan.</p>';
                return;
            }

            container.innerHTML = ''; // Kosongkan tulisan "Memuat..."
            
            // Loop data dari database dan jadikan tombol
            links.forEach(link => {
                const button = document.createElement('a');
                button.href = link.url;
                button.target = '_blank';
                button.className = 'button-link';
                // Format nomor otomatis: No. [nomor] - [Nama Produk]
                button.innerHTML = `📦 No. ${link.number} - ${link.title}`;
                container.appendChild(button);
            });
        }

        // Jalankan fungsi di atas saat halaman dibuka
        loadLinks();
    </script>
</body>
</html>
