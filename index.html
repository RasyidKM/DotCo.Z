<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotCo.Z - Shopee Affiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <div class="max-w-xl mx-auto min-h-screen flex flex-col justify-center items-center p-6 text-center space-y-6">
        <div class="space-y-2">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 to-amber-400 bg-clip-text text-transparent">
                DotCo.Z Affiliate 🛒
            </h1>
            <p class="text-slate-400 text-sm">Rekomendasi Produk Terbaik Shopee Khusus Untukmu</p>
        </div>
        
        <div class="w-full bg-slate-800/50 border border-slate-700/50 p-4 rounded-2xl text-xs text-slate-400 leading-relaxed">
            Situs ini terhubung langsung dengan sistem pelacakan database rill Supabase. Setiap kunjungan akan tercatat otomatis di dashboard monitor tim.
        </div>
    </div>

    <script>
        // 1. INISIALISASI KONEKSI SUPABASE
        const SUPABASE_URL = "https://fggigxprntyrgxwjgmvt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_9Yu_nCCwjynj0KkyztmqKw_DVW5qBxx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. SCRIPT PELACAK PENGUNJUNG OTOMATIS
        (async function lacakPengunjung() {
            const NAMA_WEB_INI = "DotCo.Z Affiliate"; 
            const daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const hariIni = daftarHari[new Date().getDay()];

            try {
                // Ambil data pengunjung hari ini berdasarkan nama web
                const { data, error } = await supabaseClient
                    .from('analytics')
                    .select('*')
                    .eq('nama_web', NAMA_WEB_INI)
                    .eq('hari', hariIni);

                if (!error && data && data.length > 0) {
                    const angkaSekarang = data[0].jumlah_pengunjung;
                    
                    // Update jumlah pengunjung +1 ke database
                    await supabaseClient
                        .from('analytics')
                        .update({ jumlah_pengunjung: angkaSekarang + 1 })
                        .eq('id', data[0].id);
                        
                    console.log("⚡ DotCo.Z Monitor: Berhasil mencatat 1 pengunjung hari " + hariIni);
                }
            } catch (err) {
                console.error("Gagal mengirim data tracking:", err);
            }
        })();
    </script>
</body>
</html>
